name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Unit and integration tests
        run: |
          mvn -B -f backend/pom.xml test
          npm ci --prefix frontend
          npm test --prefix frontend
          npm run build --prefix frontend

      - name: Build local images
        run: |
          docker build -t auth-lab-backend:ci backend
          docker build -t auth-lab-frontend:ci frontend
          docker build -t auth-lab-h2:ci database

      - name: Publish versioned images to GHCR
        if: github.event_name == 'push'
        env:
          REGISTRY: ghcr.io
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login "$REGISTRY" -u "$OWNER" --password-stdin
          OWNER_LOWER="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          for image in backend frontend h2; do
            docker tag "auth-lab-$image:ci" "$REGISTRY/$OWNER_LOWER/auth-lab-$image:$SHA"
            docker push "$REGISTRY/$OWNER_LOWER/auth-lab-$image:$SHA"
          done

      - name: Create one-node Kind
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: auth-lab

      - name: Install ingress and deploy chart
        run: |
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
          helm repo update
          helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx \
            --namespace ingress-nginx --create-namespace --version 4.11.3 --wait --timeout 8m
          kind load docker-image --name auth-lab auth-lab-backend:ci
          kind load docker-image --name auth-lab auth-lab-frontend:ci
          kind load docker-image --name auth-lab auth-lab-h2:ci
          helm upgrade --install auth-lab ./helm/auth-lab \
            --set backend.image.tag=ci --set frontend.image.tag=ci --set database.image.tag=ci \
            --atomic --wait --timeout 3m

      - name: Smoke test through Ingress
        shell: pwsh
        run: |
          kubectl -n ingress-nginx port-forward service/ingress-nginx-controller 18080:80 *> ingress.log &
          Start-Sleep -Seconds 5
          ./scripts/smoke-test.ps1 -BaseUrl http://localhost:18080
