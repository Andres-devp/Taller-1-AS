spring:
  application:
    name: auth-lab-api

auth:
  database:
    primary:
      url: ${PRIMARY_DB_URL:jdbc:h2:tcp://localhost:9092/./authdb}
    secondary:
      url: ${SECONDARY_DB_URL:jdbc:h2:tcp://localhost:9093/./authdb}
    username: ${DB_USERNAME:auth_app}
    password: ${DB_PASSWORD:change-me}
    retry-delay-ms: ${DB_RETRY_DELAY_MS:100}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,databaseAvailability
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
