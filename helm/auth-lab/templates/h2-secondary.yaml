{{- $name := include "auth-lab.fullname" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-h2-secondary
  labels:
    {{- include "auth-lab.labels" . | nindent 4 }}
    app.kubernetes.io/component: h2-secondary
spec:
  replicas: {{ .Values.database.secondary.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: h2-secondary
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: h2-secondary
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: h2-secondary
          image: "{{ .Values.database.image.repository }}:{{ .Values.database.image.tag }}"
          imagePullPolicy: {{ .Values.database.image.pullPolicy }}
          ports:
            - name: h2
              containerPort: 9092
          env:
            - name: H2_USER
              valueFrom: { secretKeyRef: { name: {{ include "auth-lab.credentialsSecretName" . }}, key: username } }
            - name: H2_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "auth-lab.credentialsSecretName" . }}, key: password } }
          resources:
            {{- toYaml .Values.database.resources | nindent 12 }}
          readinessProbe:
            tcpSocket: { port: h2 }
            initialDelaySeconds: {{ .Values.database.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.database.probes.periodSeconds }}
          livenessProbe:
            tcpSocket: { port: h2 }
            initialDelaySeconds: {{ .Values.database.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.database.probes.periodSeconds }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-h2-secondary
  labels:
    {{- include "auth-lab.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: h2-secondary
  ports:
    - name: h2
      port: 9092
      targetPort: h2
