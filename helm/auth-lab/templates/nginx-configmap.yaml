apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "auth-lab.fullname" . }}-nginx
  labels:
    {{- include "auth-lab.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;
      location = /healthz { return 200 'ok'; add_header Content-Type text/plain; }
      location /api/ {
        proxy_pass http://{{ include "auth-lab.fullname" . }}-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      }
      location / { try_files $uri $uri/ /index.html; }
    }
